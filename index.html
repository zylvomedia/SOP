<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zylvo — Outreach CRM</title>
<style>
  :root{
    --blue:#0071E3; --blue-dark:#0058B0; --blue-light:#E8F1FD;
    --ink-950:#1D1D1F; --ink-800:#3A3A3C; --ink-600:#6E6E73; --ink-400:#A1A1A6; --ink-200:#D2D2D7; --ink-100:#E8E8ED;
    --canvas:#F5F5F7; --white:#FFFFFF;
    --green:#2FA84F; --green-light:#E7F7EC;
    --orange:#FF9500; --orange-light:#FFF3E0;
    --red:#FF3B30; --red-light:#FFEBEA;
    --purple:#AF52DE; --pink:#FF375F; --gray:#8E8E93; --gray-light:#F0F0F2;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink-950);font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  a{color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d2d2d7;border-radius:999px;border:2px solid var(--canvas)}

  .app{display:flex;height:100vh}
  .sidebar{width:230px;flex-shrink:0;display:flex;flex-direction:column;background:var(--white);border-right:1px solid var(--ink-100)}
  .sidebar-head{padding:22px 20px 16px}
  .sidebar-head .brand{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .sidebar-head .sub{margin-top:2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-400)}
  .nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:4px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:10px 12px;border-radius:12px;text-align:left;font-size:14px;font-weight:500;color:var(--ink-600)}
  .nav-item:hover{background:var(--ink-100);color:var(--ink-950)}
  .nav-item.active{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 12px rgba(0,0,0,.04)}
  .nav-divider{margin:8px 12px 4px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-400)}
  .sidebar-foot{border-top:1px solid var(--ink-100);padding:14px 20px}
  .sidebar-foot .today{font-size:11px;color:var(--ink-400)}
  .sidebar-foot .reset{margin-top:6px;border:none;background:none;padding:0;font-size:11px;font-weight:500;color:var(--ink-400);display:flex;align-items:center;gap:5px}
  .sidebar-foot .reset:hover{color:var(--blue)}

  .main{flex:1;overflow-y:auto}
  .container{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
  .page-head{margin-bottom:22px}
  .page-head h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
  .page-head p{margin:4px 0 0;font-size:13px;color:var(--ink-600)}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
  .search-wrap{position:relative}
  .search-wrap input{width:230px;padding:8px 12px 8px 32px;border-radius:10px;border:1px solid var(--ink-200);font-size:13px;outline:none;background:#fff}
  .search-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-400)}
  select.pill, .pill-select{border-radius:10px;border:1px solid var(--ink-200);background:#fff;padding:8px 10px;font-size:13px;outline:none;color:var(--ink-800)}
  select.pill:focus{border-color:var(--blue)}
  .count{font-size:12px;color:var(--ink-400)}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid var(--ink-200);background:#fff;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-800)}
  .btn:hover{background:var(--ink-100)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-dark)}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff}
  .btn.ghost{border:none;background:none;padding:6px 10px}
  .btn.ghost:hover{background:var(--ink-100)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .bulkbar{display:flex;align-items:center;gap:10px;background:var(--blue-light);border:1px solid rgba(0,113,227,.25);border-radius:12px;padding:9px 14px;margin-bottom:10px;font-size:13px;color:var(--blue-dark);font-weight:600}
  .bulkbar .clear{border:none;background:none;font-size:12px;font-weight:600;color:var(--blue-dark);text-decoration:underline;margin-left:auto}

  table{width:100%;border-collapse:collapse;font-size:13px}
  .table-card{border-radius:16px;border:1px solid var(--ink-100);background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 12px rgba(0,0,0,.04)}
  thead tr{background:var(--canvas);text-align:left;font-size:12px;color:var(--ink-600);border-bottom:1px solid var(--ink-100)}
  th,td{padding:10px 12px}
  tbody tr{border-bottom:1px solid var(--ink-100)}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:rgba(245,245,247,.7)}
  .lead-cell{display:flex;align-items:center;gap:10px;cursor:pointer}
  .lead-name{font-weight:600;color:var(--ink-950)}
  .lead-handle{font-size:12px;color:var(--ink-600)}
  .lead-handle a{color:var(--blue);text-decoration:none}
  .lead-handle a:hover{text-decoration:underline}

  .ig-avatar{width:34px;height:34px;flex-shrink:0;display:block;object-fit:contain}
  .ig-avatar.sm{width:28px;height:28px}

  .status-pill{border:none;border-radius:999px;padding:5px 9px;font-size:11.5px;font-weight:600;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none}
  .stage-pill{border:1px solid var(--ink-200);border-radius:999px;background:#fff;padding:5px 9px;font-size:11.5px;font-weight:600;color:var(--ink-800);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none}
  .status-Not-Responded{background:var(--gray-light);color:var(--gray)}
  .status-Responded{background:var(--blue-light);color:var(--blue-dark)}
  .status-Scheduled-for-Call{background:var(--orange-light);color:var(--orange)}
  .status-Closed{background:var(--green-light);color:var(--green)}
  .status-Rejected{background:var(--red-light);color:var(--red)}
  .status-Dead-End{background:var(--ink-100);color:var(--ink-600)}

  .next-due{font-size:12px;color:var(--ink-600)}
  .next-due.overdue{color:var(--red);font-weight:700}
  .next-due.today{color:var(--orange);font-weight:700}
  .next-due.soon{color:var(--blue);font-weight:600}

  .empty-row td{padding:40px;text-align:center;color:var(--ink-400);font-size:13px}

  .modal-overlay{position:fixed;inset:0;background:rgba(29,29,31,.4);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.16);width:100%;max-width:460px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .modal.wide{max-width:640px}
  .modal-head{display:flex;align-items:center;justify-content:between;padding:18px 22px;border-bottom:1px solid var(--ink-100)}
  .modal-head h2{font-size:17px;font-weight:700;margin:0;flex:1}
  .modal-body{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--ink-100);display:flex;justify-content:flex-end;gap:8px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-600);margin-bottom:4px}
  .field input, .field select, .field textarea{width:100%;border-radius:10px;border:1px solid var(--ink-200);padding:8px 11px;font-size:13px;outline:none}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .err{font-size:12.5px;color:var(--red)}

  .drawer-overlay{position:fixed;inset:0;background:rgba(29,29,31,.32);backdrop-filter:blur(2px);z-index:40;display:flex;justify-content:flex-end}
  .drawer{width:100%;max-width:460px;height:100%;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.14);overflow-y:auto}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--ink-100)}
  .drawer-name{font-size:18px;font-weight:700}
  .drawer-handle{font-size:13px;color:var(--ink-600);margin-top:1px}
  .drawer-handle a{color:var(--blue);text-decoration:none}
  .drawer-handle a:hover{text-decoration:underline}
  .drawer-badges{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;border-bottom:1px solid var(--ink-100)}
  .drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 22px;border-bottom:1px solid var(--ink-100);font-size:13px}
  .drawer-grid .lbl{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-400);letter-spacing:.03em}
  .drawer-grid .val{margin-top:2px}
  .drawer-section{padding:16px 22px}
  .drawer-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .drawer-section-head .lbl{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-400);letter-spacing:.03em}
  .msg-block{border:1px solid var(--ink-100);border-radius:12px;background:var(--canvas);padding:11px 13px;margin-bottom:9px}
  .msg-block .msg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .msg-block .msg-label{font-size:10.5px;font-weight:600;color:var(--ink-400)}
  .msg-block .msg-text{font-size:13px;line-height:1.5;white-space:pre-line}
  .copy-btn{border:none;background:none;color:var(--ink-400);border-radius:6px;padding:3px 5px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
  .copy-btn:hover{background:var(--ink-100);color:var(--blue)}
  .copy-btn.copied{color:var(--green)}
  .msg-edit-row textarea{width:100%;border-radius:10px;border:1px solid var(--ink-200);padding:9px 11px;font-size:13px;outline:none;resize:vertical}
  .drawer-foot{padding:16px 22px;border-top:1px solid var(--ink-100);display:flex;justify-content:flex-end}

  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .kcol{width:250px;flex-shrink:0;background:#fff;border:1px solid var(--ink-100);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 12px rgba(0,0,0,.04)}
  .kcol-head{padding:12px 14px;border-bottom:1px solid var(--ink-100)}
  .kcol-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .kcol-dot{width:8px;height:8px;border-radius:999px}
  .kcol-count{margin-left:auto;background:var(--canvas);color:var(--ink-600);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px}
  .kcol-sub{font-size:10.5px;color:var(--ink-400);margin-top:3px}
  .kcol-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
  .kcard{border:1px solid var(--ink-100);border-radius:12px;background:#fff;padding:11px 12px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kcard:focus{outline:2px solid var(--blue);outline-offset:2px}
  .kcard:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
  .kcard-top{display:flex;align-items:center;gap:8px}
  .kcard-name{font-size:13px;font-weight:600}
  .kcard-handle{font-size:11px;color:var(--ink-600)}
  .kcard-meta{font-size:11px;color:var(--ink-600);margin-top:7px}
  .kcol-empty{padding:20px 6px;text-align:center;font-size:11.5px;color:var(--ink-400)}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .stat-card{background:#fff;border:1px solid var(--ink-100);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 12px rgba(0,0,0,.04)}
  .stat-card .top-lbl{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-400)}
  .stat-card .n{font-size:28px;font-weight:800;margin-top:6px}
  .stat-card .sub{font-size:12.5px;color:var(--ink-600);margin-top:3px}
  .stat-card .l{font-size:12px;color:var(--ink-600);margin-top:2px}
  .warn-banner{background:var(--red-light);color:var(--red);border-radius:12px;padding:13px 18px;font-size:13.5px;margin-bottom:18px}
  .chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px;align-items:stretch}
  .vchart{display:flex;align-items:flex-end;gap:16px;height:190px;padding:6px 4px 0;position:relative}
  .vchart .gridlines{position:absolute;left:0;right:0;top:0;bottom:26px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .vchart .gridline{border-top:1px dashed var(--ink-100);position:relative}
  .vchart .gridline .gl-label{position:absolute;left:-26px;top:-7px;font-size:10.5px;color:var(--ink-400);width:22px;text-align:right}
  .vbar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;position:relative;z-index:1}
  .vbar{width:60%;max-width:34px;border-radius:6px 6px 0 0;background:var(--blue)}
  .vbar-label{font-size:10.5px;color:var(--ink-600);margin-top:6px;text-align:center;height:26px}
  .donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px}
  .donut{width:150px;height:150px;border-radius:50%;position:relative}
  .donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
  .donut-legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:12px;color:var(--ink-800)}
  .donut-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .hbar-row .lbl{width:170px;flex-shrink:0;color:var(--ink-800)}
  .hbar-track{flex:1;height:14px;border-radius:6px;background:var(--ink-100);overflow:hidden}
  .hbar-fill{height:100%;border-radius:6px;background:var(--green)}
  .hbar-row .n{width:28px;text-align:right;color:var(--ink-600);font-size:12px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
  .bar-row .lbl{width:150px;flex-shrink:0;color:var(--ink-800)}
  .bar-track{flex:1;height:9px;border-radius:999px;background:var(--ink-100);overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;background:var(--blue)}
  .bar-row .n{width:34px;text-align:right;color:var(--ink-600);font-size:12px}
  .card-block{background:#fff;border:1px solid var(--ink-100);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 12px rgba(0,0,0,.04);margin-bottom:18px}
  .card-block h3{margin:0 0 12px;font-size:15px;font-weight:700}

  .sop-wrap{max-width:760px}
  .sop-kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin:0}
  .sop-title{margin:4px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .sop-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px;border:1px solid var(--ink-100);background:#fff;border-radius:14px;padding:18px}
  @media(min-width:640px){.sop-fields{grid-template-columns:repeat(4,1fr)}}
  .sop-fields .fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-400)}
  .sop-fields .fv{margin-top:2px;font-size:13px;font-weight:600;color:var(--ink-950)}
  .sop-section{margin-top:34px;scroll-margin-top:20px}
  .sop-section-head{display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--ink-100);padding-bottom:9px;margin-bottom:12px}
  .sop-section-head .sid{font-size:12px;font-weight:700;color:var(--ink-400)}
  .sop-section-head h2{margin:0;font-size:20px;font-weight:700}
  .sop-p{margin:0 0 11px;font-size:14.5px;line-height:1.65;color:var(--ink-800)}
  .sop-step{display:flex;gap:14px;border:1px solid var(--ink-100);background:#fff;border-radius:10px;padding:12px 15px;margin-bottom:9px}
  .sop-step .sn{flex-shrink:0;margin-top:1px;font-size:12px;font-weight:700;color:var(--blue)}
  .sop-step .st{font-size:13.5px;font-weight:700;margin:0 0 3px}
  .sop-step .sb{font-size:13.5px;line-height:1.55;color:var(--ink-800);margin:0}
  .sop-step .sm{margin-top:5px;font-size:11px;color:var(--ink-400)}
  .sop-callout{margin-top:12px;border:1px solid rgba(255,149,0,.3);background:var(--orange-light);border-radius:10px;padding:11px 15px;font-size:13.5px;line-height:1.55;color:var(--ink-950)}
  .sop-table-wrap{margin-top:12px;border:1px solid var(--ink-100);border-radius:10px;overflow:hidden}
  .sop-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .sop-table thead tr{background:var(--canvas);text-align:left;font-size:12px;color:var(--ink-600)}
  .sop-table th,.sop-table td{padding:9px 14px}
  .sop-table tbody tr{border-top:1px solid var(--ink-100)}
  .sop-table td.tmpl{font-size:12px;font-weight:700;color:var(--blue)}
  .sop-tmpl-card{border:1px solid var(--ink-100);background:#fff;border-radius:10px;padding:13px 15px;margin-bottom:9px}
  .sop-tmpl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .sop-tmpl-id{font-size:12.5px;font-weight:700}
  .sop-tmpl-text{font-size:13.5px;line-height:1.6;color:var(--ink-800);white-space:pre-line;margin:0}
  .sop-tmpl-note{margin:7px 0 0;font-size:11px;color:var(--ink-400)}
  .sop-copy-btn{border:1px solid var(--ink-200);background:#fff;border-radius:8px;padding:3px 10px;font-size:11.5px;font-weight:600;color:var(--ink-800)}
  .sop-copy-btn:hover{background:var(--ink-100)}
  .sop-copy-btn.copied{color:var(--green);border-color:var(--green)}
  .sop-checklist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .sop-checklist li{display:flex;gap:9px;border:1px solid var(--ink-100);background:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-800)}
  .sop-checklist li span.dash{color:var(--ink-400)}
  .sop-rules{margin-top:12px;display:flex;flex-direction:column;gap:11px}
  .sop-rule{border-left:2px solid rgba(0,113,227,.4);padding-left:14px}
  .sop-rule .rt{font-size:13.5px;font-weight:700;margin:0 0 2px}
  .sop-rule .rb{font-size:13.5px;line-height:1.55;color:var(--ink-800);margin:0}
  .sop-footer{margin-top:36px;border-top:1px solid var(--ink-100);padding-top:16px;font-size:11.5px;line-height:1.55;color:var(--ink-400)}

  .notes-layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
  .lead-picker{background:#fff;border:1px solid var(--ink-100);border-radius:14px;padding:8px;max-height:70vh;overflow-y:auto}
  .lead-pick-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:8px 9px;border-radius:10px;text-align:left}
  .lead-pick-item:hover{background:var(--canvas)}
  .lead-pick-item.active{background:var(--blue-light)}
  .lead-pick-item .n{font-size:12.5px;font-weight:600}
  .lead-pick-item .h{font-size:11px;color:var(--ink-600)}
  .notes-panel{background:#fff;border:1px solid var(--ink-100);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 12px rgba(0,0,0,.04)}
  .note-item{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--ink-100);border-radius:12px;background:var(--canvas);padding:11px 13px;margin-bottom:9px}
  .note-item .txt{font-size:13px;line-height:1.5}
  .note-item .meta{font-size:10.5px;color:var(--ink-400);margin-top:4px}
  .media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .media-thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--ink-100);background:var(--canvas)}
  .media-thumb img{width:100%;height:100%;object-fit:cover}

const SOP_HEADER={kicker:"Standard Operating Procedure",title:"Cold DM Outreach — Meta Ads Media Buyers",fields:[{label:"Doc owner",value:"Zylvo Media"},{label:"Applies to",value:"Instagram outreach"},{label:"Target",value:"Meta ads buyers"},{label:"Last updated",value:"Sep 2026"}]};
const SOP_SECTIONS=[{id:"0.1",title:"Purpose",body:["Turn a cold Instagram DM into a warm reply, without sending a portfolio link. This SOP covers the opener, the Loom offer, and a five-touch follow-up sequence. Everything here is written to be sent at volume — no step requires a custom asset per lead."]},{id:"0.2",title:"Scope",body:["Applies to first-contact Instagram DMs to media buyers / ad managers sourced through the lead-gen process. Does not cover pricing negotiation, contracts, or onboarding — those start once a call is booked."]},{id:"1",title:"Procedure — first contact",steps:[{n:"1.1",title:"Pull one specific detail from their ad page",body:"Open the lead's Meta Ad Library page. Note: how many ads are live, how long they've been running, whether the creative repeats a shot/frame. This detail is what makes the opener specific — do not send an opener without it.",meta:"~2 min per lead · source: Ad Library"},{n:"1.2",title:"Send the opener — no link, no attachment",body:"One line, their name, the detail from 1.1, ending in a gap they'd want closed. Template T1."},{n:"1.3",title:"Send who you are, in their terms",body:'Volume, turnaround, variation — not "high quality." Template T2.'},{n:"1.4",title:"Send one true proof line",body:"A real client outcome stated as a fact: vertical, volume, turnaround. No invented performance numbers (CPA, ROAS). Template T3."},{n:"1.5",title:"Ask for permission to send the Loom — give a choice, not yes/no",body:"End on a question with two easy answers, not one. Template T4."}],callout:'Rule: never paste a Loom or portfolio URL into message 1–4. A link collapses the preview text to "Sent a link" in their request folder, which is the exact thing this sequence is built to avoid.'},{id:"2",title:"Procedure — on reply",steps:[{n:"2.1",title:"Record the Loom (once they’ve said yes)",body:"Screen record on their live ads. Two minutes total: the recut (0:00–1:20) → the ask (1:20–1:45)."},{n:"2.2",title:"Close the Loom on a choice",body:'"Want me to send over 3 finished ads in your niche, or grab 15 minutes this week?" Either answer moves them to the next stage.'},{n:"2.3",title:"Log the lead's stage",body:"Opener sent → opener replied → Loom sent → Loom watched → call booked. Use the tracker (Section 5)."}]},{id:"3",title:"Procedure — no reply (follow-up ladder)",body:["Run only if step 1 gets no reply. Five touches, five different message types, spaced as below. Do not repeat a message type back to back — that's what makes each one look new in their inbox preview."],table:{headers:["Day","Type","Template","Purpose"],rows:[["2","Text","T5","Interrupt — get the thread reopened"],["5","GIF + text","T6","Light bump, zero effort, same asset every lead"],["8","Text","T7","Soft check-in, easy out"],["12","Text","T8","Real deadline, only if true"],["16","Text","T9","Close the loop, stop the sequence"]]}},{id:"4",title:"Message templates",body:["Tap Copy, then swap the highlighted placeholders before sending."],templates:[{id:"T1",label:"opener",text:"[Name], [X] ads live for the [client] account and all [X] open on the same shot???"},{id:"T2",label:"who you are",text:"I'm Joe, I run Zylvo Media. We cut ad creative for Meta buyers in volume: 10–40 finished ads a month, new hooks and angles each round, most batches back in 48 hours."},{id:"T3",label:"proof line",text:'[Real outcome, e.g. "40 assets, two days, home services vertical, for a client running $30k/mo"]'},{id:"T4",label:"the ask",text:"I recorded a 2 minute Loom on [X] of your live ads, showing where I'd recut the first 3 seconds and the angles I'd test against them. Want the Loom, or easier to grab 15 minutes this week?"},{id:"T5",label:"day 2 follow-up",text:`beep beep
manual follow-up, I actually typed this one.
[Name], if the [vertical] creative's already handled, say so and I'll leave you alone. If not, the Loom's 2 minutes and it's about your ads, not mine.`},{id:"T6",label:"day 5 follow-up",text:`[send: one reusable GIF/meme, same one for every lead, no customizing]
lol no pressure, just didn’t want this to get buried`,note:"Attach one reusable GIF/meme — same asset for every lead, never customized."},{id:"T7",label:"day 8 follow-up",text:"no rush either way, just let me know if creative's ever something you want off your plate"},{id:"T8",label:"day 12 follow-up",text:"[Name], Q4 creative is usually locked in by mid-October and I'm holding [X] slots for November. If you want fresh angles tested before spend goes up, now's the window. Same 2-minute Loom, still yours to ignore."},{id:"T9",label:"day 16 follow-up",text:"Not chasing you further. If creative volume ever becomes the bottleneck, this thread's still here."}]},{id:"5",title:"Tracking",body:["Per batch of 50 leads, record: opened, replied, Loom watched, call/next-step accepted. Review weekly."],checklist:["Reply rate under 10% → problem is the opener (step 1.2), not the rest of the sequence","They reply but don't watch the Loom → the ask (step 1.5 / T4) is too vague","They watch and go quiet → the Loom is selling instead of showing"]},{id:"6",title:"Rules",rules:[{title:"No links before message 5",body:"A URL in messages 1–4 collapses your preview text. Loom link only goes out after they’ve replied to T4."},{title:"Give a choice, not a yes/no",body:"Every ask ends with two easy answers, never one that’s easiest to ignore."},{title:"Keep the ladder low-effort",body:"Every follow-up (T5–T9) should be reusable as-is, or with just a name/placeholder swap. If a step requires digging into their account or making something new, drop it."},{title:"Never invent a performance number",body:"No CPA, ROAS, or results claims that aren’t true. Buyers check."},{title:'Never use "just following up" or "bumping this"',body:"Signals you have nothing new to say — lowest-performing line in the whole sequence."},{title:"Stop after touch 5 (day 16)",body:"No further sends without a genuinely new reason. Re-entry next quarter is fine; a bump is not."}]}];

function addDays(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function computeNext(status, stage, lastInteractionDate){
  if (status==="Closed" || status==="Rejected" || status==="Dead End") return {nextActionDate:null,label:"No further action"};
  const off = STAGE_OFFSET[stage];
  if (off===null || off===undefined) return {nextActionDate:null,label:"Sequence complete"};
  return {nextActionDate:addDays(lastInteractionDate,off),label:""};
}
function emptyMessages(){ return {first_dm:"",who_you_are:"",proof_line:"",follow_up_1:"",follow_up_2:"",follow_up_3:"",follow_up_4:"",follow_up_5:""}; }
function buildSeed(){
  return RAW_SEED.map((e,i)=>{
    const n = computeNext(e.status, e.stage, e.lastInteractionDate);
    return {
      id:"lead-"+String(i+1).padStart(3,"0"), handle:e.handle, displayName:e.name, niche:e.niche, client:e.client,
      igUrl:"https://instagram.com/"+e.handle, source:e.source, status:e.status, stage:e.stage,
      lastInteractionDate:e.lastInteractionDate, nextActionDate:n.nextActionDate, dateTrackerLabel:n.label,
      notes:e.notes, noteLog: e.notes ? [{id:"note-seed-"+i, text:e.notes, addedAt:new Date().toISOString()}] : [],
      media:[], messages: emptyMessages()
    };
  });
}
function nextLeadId(leads){
  let m=0; leads.forEach(l=>{ const mm=/lead-(\d+)/.exec(l.id); if(mm) m=Math.max(m,parseInt(mm[1],10)); });
  return "lead-"+String(m+1).padStart(3,"0");
}
function loadLeads(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(!raw) return buildSeed();
    const parsed = JSON.parse(raw); return Array.isArray(parsed)&&parsed.length ? parsed : buildSeed();
  }catch(e){ return buildSeed(); }
}
function saveLeads(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.leads)); }catch(e){} }

const NOTES_STORAGE_KEY = "zylvo_crm_notes_v1";
function loadWorkspaceNotes(){
  try{ const raw = localStorage.getItem(NOTES_STORAGE_KEY); if(!raw) return {notes:[],media:[]};
    const parsed = JSON.parse(raw);
    return {notes:Array.isArray(parsed.notes)?parsed.notes:[], media:Array.isArray(parsed.media)?parsed.media:[]};
  }catch(e){ return {notes:[],media:[]}; }
}
function saveWorkspaceNotes(){ try{ localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify({notes:state.notes, media:state.media})); }catch(e){} }

function fmtDate(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function fmtDateTime(iso){ return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function daysDiff(today,d){ return Math.round((new Date(d+"T00:00:00")-new Date(today+"T00:00:00"))/86400000); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slug(s){ return String(s).replace(/[^a-zA-Z0-9]+/g,"-"); }
function parseCsvLine(line){
  const result = [];
  let cur = "";
  let inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ result.push(cur); cur = ""; }
      else cur += c;
    }
  }
  result.push(cur);
  return result.map(s=>s.trim());
}

  copyMessage(btn, text){
    if(!text) return;
    const done = ()=>{
      btn.classList.add("copied");
      btn.innerHTML = Icon.check+" Copied";
      setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = Icon.copy+" Copy"; },1400);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  },
  copySopTemplate(btn, text){
    if(!text) return;
    const done = ()=>{
      btn.classList.add("copied");
      btn.textContent = "Copied";
      setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "Copy"; },1400);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  },
  openAdd(){ state.showAddModal = true; render(); },
  closeAdd(){ state.showAddModal = false; render(); },
  submitAdd(e){
    e.preventDefault();
    const f = e.target;
    const handle = f.handle.value.trim().replace(/^@/,"");
    const errEl = document.getElementById("add-err");
    if(!handle){ errEl.textContent = "An Instagram handle is required."; return; }
    const status = f.status.value, stage = f.stage.value;
    const lastInteractionDate = f.lastInteractionDate.value || TODAY;
    const n = computeNext(status, stage, lastInteractionDate);
    const lead = {
      id: nextLeadId(state.leads), handle, displayName: f.displayName.value.trim() || handle,
      niche: f.niche.value.trim() || "Uncategorized", client: f.client.value.trim() || "—",
      igUrl: "https://instagram.com/"+handle, source:"Added manually", status, stage,
      lastInteractionDate, nextActionDate:n.nextActionDate, dateTrackerLabel:n.label,
      notes: f.notes.value.trim(), noteLog: f.notes.value.trim() ? [{id:"note-"+Date.now(), text:f.notes.value.trim(), addedAt:new Date().toISOString()}] : [],
      media:[], messages: emptyMessages()
    };
    state.leads = [lead, ...state.leads]; saveLeads();
    state.showAddModal = false; render();
  },
  openImport(){ state.showImportModal = true; state.importText=""; render(); },
  closeImport(){ state.showImportModal = false; render(); },
  handleImportFile(input){
    const file = input.files && input.files[0];
    if(!file) return;
    if(!/\.csv$/i.test(file.name) && file.type && !file.type.includes("csv") && !file.type.includes("text")){
      toast("That doesn't look like a CSV file.");
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const ta = document.getElementById("import-text");
      if(ta) ta.value = String(e.target.result || "");
      const label = document.getElementById("import-filename");
      if(label) label.textContent = "Loaded "+file.name+" — review below, then Import";
    };
    reader.onerror = ()=>{ toast("Couldn't read that file — try pasting the rows instead."); };
    reader.readAsText(file);
  },
  runImport(){
    const text = document.getElementById("import-text").value.trim();
    if(!text) return;
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){ toast("Add a header row plus at least one lead."); return; }
    const headers = parseCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
    const idx = {
      handle: headers.findIndex(h=>h.includes("handle")),
      name: headers.findIndex(h=>h==="name"||h.includes("name")&&!h.includes("client")),
      niche: headers.findIndex(h=>h.includes("niche")),
      status: headers.findIndex(h=>h.includes("status")),
      stage: headers.findIndex(h=>h.includes("stage")),
      date: headers.findIndex(h=>h.includes("date")),
    };
    if(idx.handle===-1){ toast("Couldn't find a handle column — it's required."); return; }
    const newLeads = [];
    let counter = 0;
    for(let i=1;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      const handle = (cols[idx.handle]||"").replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/\/$/,"").split("?")[0];
      if(!handle) continue;
      const status = STATUSES.includes(cols[idx.status]) ? cols[idx.status] : "Not Responded";
      const stage = STAGES.includes(cols[idx.stage]) ? cols[idx.stage] : "Initial Outreach";
      const lastInteractionDate = /^\d{4}-\d{2}-\d{2}$/.test(cols[idx.date]) ? cols[idx.date] : TODAY;
      const n = computeNext(status, stage, lastInteractionDate);
      counter++;
      newLeads.push({
        id: "lead-import-"+Date.now()+"-"+counter, handle, displayName: cols[idx.name]||handle,
        niche: cols[idx.niche]||"Uncategorized", client:"—", igUrl:"https://instagram.com/"+handle,
        source:"Imported", status, stage, lastInteractionDate, nextActionDate:n.nextActionDate, dateTrackerLabel:n.label,
        notes:"", noteLog:[], media:[], messages: emptyMessages()
      });
    }
    if(newLeads.length===0){ toast("No valid rows found."); return; }
    state.leads = [...newLeads, ...state.leads]; saveLeads();
    state.showImportModal = false; render();
    toast("Imported "+newLeads.length+" lead"+(newLeads.length===1?"":"s")+".");
  },
  resetSample(){
    if(!confirm("Reset to the original sample data? This clears any leads you've imported or edited in this browser.")) return;
    state.leads = buildSeed(); saveLeads(); state.drawerLeadId=null; state.selectedIds=new Set(); render();
  },
  addNote(){
    const ta = document.getElementById("note-textarea");
    if(!ta || !ta.value.trim()) return;
    const entry = {id:"note-"+Date.now(), text: ta.value.trim(), addedAt: new Date().toISOString()};
    state.notes = [entry, ...state.notes];
    saveWorkspaceNotes();
    ta.value = "";
    render();
  },
  deleteNote(noteId){
    state.notes = state.notes.filter(n=>n.id!==noteId);
    saveWorkspaceNotes();
    render();
  },
  addMedia(input){
    const files = Array.from(input.files||[]);
    const maxSize = 3*1024*1024;
    const readers = [];
    files.forEach(f=>{
      if(f.size>maxSize){ toast(f.name+" is over 3MB and was skipped."); return; }
      readers.push(new Promise((res)=>{
        const r = new FileReader();
        r.onload = ()=>res({id:"media-"+Date.now()+"-"+Math.random().toString(36).slice(2,7), name:f.name, type:f.type, dataUrl:r.result, addedAt:new Date().toISOString()});
        r.readAsDataURL(f);
      }));
    });
    Promise.all(readers).then(items=>{
      if(!items.length) return;
      state.media = [...items, ...state.media];
      saveWorkspaceNotes();
      render();
    });
    input.value = "";
  },
  removeMedia(mediaId){
    state.media = state.media.filter(m=>m.id!==mediaId);
    saveWorkspaceNotes();
    render();
  }
};
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

  const d = daysDiff(TODAY, lead.nextActionDate);
  let cls="", label="Due "+fmtDate(lead.nextActionDate);
  if(d<0){ cls="overdue"; label="Overdue "+Math.abs(d)+"d — "+fmtDate(lead.nextActionDate); }
  else if(d===0){ cls="today"; label="Due today"; }

  return '<span class="next-due '+cls+'">'+label+'</span>';
}

function filteredSortedLeads(){
  let leads = state.leads.filter(l=>{
    const s = state.search.trim().toLowerCase();
    const matchesSearch = !s || l.handle.toLowerCase().includes(s) || l.displayName.toLowerCase().includes(s) || l.niche.toLowerCase().includes(s) || l.client.toLowerCase().includes(s);
    const matchesStatus = state.statusFilter==="All" || l.status===state.statusFilter;
    const matchesStage = state.stageFilter==="All" || l.stage===state.stageFilter;
    return matchesSearch && matchesStatus && matchesStage;
  });
  leads = leads.slice().sort((a,b)=>{
    if(state.sort==="next"){
      if(!a.nextActionDate) return 1; if(!b.nextActionDate) return -1;
      return a.nextActionDate.localeCompare(b.nextActionDate);
    }
    if(state.sort==="recent") return b.lastInteractionDate.localeCompare(a.lastInteractionDate);
    if(state.sort==="handle") return a.handle.localeCompare(b.handle);
    return 0;
  });
  return leads;

/* ---------------- Analytics page ---------------- */
const STATUS_DOT = {
  "Not Responded":"#8E8E93","Responded":"#0071E3","Scheduled for Call":"#FF9500",
  "Closed":"#2FA84F","Rejected":"#FF3B30","Dead End":"#3A3A3C"
};
function renderAnalyticsPage(){
  const leads = state.leads;
  const total = leads.length;
  const byStatus = {}; STATUSES.forEach(s=>byStatus[s]=0);
  leads.forEach(l=>byStatus[l.status]=(byStatus[l.status]||0)+1);

  const repliedOrBetter = (byStatus["Responded"]||0)+(byStatus["Scheduled for Call"]||0)+(byStatus["Closed"]||0);
  const replyRate = total ? Math.round(repliedOrBetter/total*100) : 0;
  const callsBooked = byStatus["Scheduled for Call"]||0;
  const closedWon = byStatus["Closed"]||0;
  const activeInSequence = leads.filter(l=>l.status==="Not Responded" && l.stage!=="Sequence Complete").length;
  const dueToday = leads.filter(l=>l.nextActionDate===TODAY).length;
  const overdue = leads.filter(l=>l.nextActionDate && daysDiff(TODAY,l.nextActionDate)<0).length;
  const deadRejected = (byStatus["Dead End"]||0)+(byStatus["Rejected"]||0);

  let html = '<div class="page-head"><h1>Analytics</h1><p>Reply rate, pipeline health, and where leads are coming from.</p></div>';

  html += '<div class="stat-grid">'+
    '<div class="stat-card"><div class="top-lbl">Total leads</div><div class="n">'+total+'</div><div class="sub">In this workspace</div></div>'+
    '<div class="stat-card"><div class="top-lbl">Reply rate</div><div class="n" style="color:'+(replyRate<10?"var(--red)":"var(--ink-950)")+'">'+replyRate+'%</div><div class="sub">Replied, booked, or closed</div></div>'+
    '<div class="stat-card"><div class="top-lbl">Calls booked</div><div class="n" style="color:var(--blue)">'+callsBooked+'</div><div class="sub">Scheduled for call</div></div>'+
    '<div class="stat-card"><div class="top-lbl">Closed won</div><div class="n">'+closedWon+'</div><div class="sub">Onboarded onto retainer</div></div>'+
  '</div>';
  html += '<div class="stat-grid">'+
    '<div class="stat-card"><div class="top-lbl">Active in sequence</div><div class="n">'+activeInSequence+'</div><div class="sub">Not responded, still ladder-running</div></div>'+
    '<div class="stat-card"><div class="top-lbl">Due today</div><div class="n">'+dueToday+'</div><div class="sub">Send the next touch today</div></div>'+
    '<div class="stat-card"><div class="top-lbl">Overdue</div><div class="n">'+overdue+'</div><div class="sub">Past their next-action date</div></div>'+
    '<div class="stat-card"><div class="top-lbl">Dead / rejected</div><div class="n">'+deadRejected+'</div><div class="sub">Out of the active pipeline</div></div>'+
  '</div>';

  if(total>0 && replyRate<10){
    html += '<div class="warn-banner">Reply rate is under 10% — per the SOP, the opener (step 1.2) is the likely problem, not the rest of the sequence.</div>';
  }

  // Leads by stage — vertical bar chart
  const stageCounts = STAGES.map(s=>leads.filter(l=>l.stage===s).length);
  const stageMax = Math.max(10, Math.ceil(Math.max(...stageCounts,1)/10)*10);
  const stageLabels = {"Initial Outreach":"Initial Outreach","Follow-up 1":"FU 1","Follow-up 2":"FU 2","Follow-up 3":"FU 3","Follow-up 4":"FU 4","Follow-up 5":"FU 5","Sequence Complete":"Sequence Complete"};
  let vchart = '<div class="vchart"><div class="gridlines">';
  for(let i=4;i>=0;i--){ vchart += '<div class="gridline"><span class="gl-label">'+Math.round(stageMax*i/4)+'</span></div>'; }
  vchart += '</div>';
  STAGES.forEach((s,i)=>{
    const h = stageMax? Math.round(stageCounts[i]/stageMax*100) : 0;
    vchart += '<div class="vbar-col"><div class="vbar" style="height:'+h+'%" title="'+stageCounts[i]+'"></div><div class="vbar-label">'+esc(stageLabels[s])+'</div></div>';
  });
  vchart += '</div>';

  // Status breakdown — donut chart
  let cursor = 0; const segments = [];
  STATUSES.forEach(s=>{
    const n = byStatus[s]||0; if(!n) return;
    const pct = total? n/total*100 : 0;
    segments.push(STATUS_DOT[s]+" "+cursor.toFixed(2)+"% "+(cursor+pct).toFixed(2)+"%");
    cursor += pct;
  });
  const donutBg = segments.length ? 'conic-gradient('+segments.join(",")+')' : 'var(--ink-100)';
  let legend = STATUSES.filter(s=>byStatus[s]>0).map(s=>
    '<span><span class="sw" style="background:'+STATUS_DOT[s]+'"></span>'+esc(s)+'</span>'
  ).join("");
  if(!legend) legend = '<span style="color:var(--ink-400)">No leads yet</span>';

  html += '<div class="chart-grid">'+
    '<div class="card-block" style="margin-bottom:0"><h3>Leads by stage</h3>'+vchart+'</div>'+
    '<div class="card-block" style="margin-bottom:0"><h3>Status breakdown</h3><div class="donut-wrap"><div class="donut" style="background:'+donutBg+'"></div><div class="donut-legend">'+legend+'</div></div></div>'+
  '</div>';

  // Leads by niche — horizontal bar chart
  const nicheCounts = {};
  leads.forEach(l=>{ const n = l.niche||"Uncategorized"; nicheCounts[n]=(nicheCounts[n]||0)+1; });
  const niches = Object.keys(nicheCounts).sort((a,b)=>nicheCounts[b]-nicheCounts[a]);
  const nicheMax = Math.max(1, ...niches.map(n=>nicheCounts[n]));
  html += '<div class="card-block"><h3>Leads by niche</h3>';
  if(niches.length===0){ html += '<p style="font-size:13px;color:var(--ink-400)">No leads yet.</p>'; }
  else niches.forEach(n=>{
    const c = nicheCounts[n]; const pct = Math.round(c/nicheMax*100);
    html += '<div class="hbar-row"><span class="lbl">'+esc(n)+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%"></div></div><span class="n">'+c+'</span></div>';
  });
  html += '</div>';

  return html;
}

  return html;

  } else if(hasAnyMsg){

  html += '</div></div>';
  return html;
}

      '</label>'+

      '<textarea id="import-text" rows="8" placeholder="handle,name,niche,status,stage,date&#10;maria.ads,Maria,Home services,Not Responded,Follow-up 2,2026-09-10" style="width:100%;border-radius:10px;border:1px solid var(--ink-200);padding:10px 12px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;outline:none"></textarea>'+
    '</div><div class="modal-foot"><button class="btn" onclick="App.closeImport()">Cancel</button><button class="btn primary" onclick="App.runImport()">Import</button></div>'+
  '</div></div>';
}

/* ---------------- Root render ---------------- */
function pageBody(){
  if(state.page==="leads") return renderLeadsPage();
  if(state.page==="pipeline") return renderPipelinePage();
  if(state.page==="analytics") return renderAnalyticsPage();
  if(state.page==="sop") return renderSopPage();
  if(state.page==="notes") return renderNotesPage();
  return "";
}
function render(){
  const root = document.getElementById("root");
  root.innerHTML = '<div class="app">'+renderSidebar()+
    '<main class="main"><div class="container" id="page-body">'+pageBody()+'</div></main>'+
  '</div>'+renderDrawer()+renderAddModal()+renderImportModal();
}
render();
</script>
</body>
